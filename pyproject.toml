[tool.poetry]
name = "holocron-api"
version = "0.1.0"
description = ""
authors = ["Mark Howard <mark.howard.7@us.af.mil>", "Abhaya Shrestha <abhaya.shrestha@us.kbr.com>"]

[tool.poetry.dependencies]
python = "^3.10"
alembic = "^1.7.7"
Flask = "^2.1.1"
gunicorn = "^20.1.0"
SQLAlchemy = "^2.0.0"
marshmallow = "^3.15.0"
marshmallow-sqlalchemy = "^0.28.0"
flasgger = "^0.9.5"
apispec-webframeworks = "^0.5.2"
PyJWT = "^2.3.0"
apispec = "^5.2.2"
psycopg2-binary = "^2.9.3"
Flask-Limiter = "^2.5.0"
APScheduler = "^3.9.1.post1"
black = "^22.10.0"
mypy = "^0.991"

[tool.poetry.dev-dependencies]
isort = "^5.10.1"
pydocstyle = "^6.1.1"
pytest = "^7.1.1"
pytest-cov = "^3.0.0"
toml = "^0.10.2"
pylint = "^2.13.9"
openapi-spec-validator = "^0.4.0"

[tool.pydocstyle]
match-dir = "^(?!alembic).*"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.isort]
profile = "black"

[tool.mypy]
exclude = ["^alembic"]

[[tool.mypy.overrides]]
module = ["apispec_webframeworks.flask", "flasgger", "openapi_spec_validator", "apscheduler.*"]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.pylint.'MESSAGES CONTROL']
disable = ["R0903", "R0801", "W1203"]
max-line-length = 88
ignore = ["tests", "alembic", ".cache"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
