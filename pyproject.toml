[tool.poetry]
name = "holocron-api"
version = "0.1.0"
description = ""
authors = ["Mark Howard <mark.howard.7@us.af.mil>", "Abhaya Shrestha <abhaya.shrestha@us.kbr.com>"]

[tool.poetry.dependencies]
python = "^3.10"
alembic = "^1.7.7"
Flask = "^3.0.0"
gunicorn = "^22.0.0"
SQLAlchemy = "^2.0.1"
marshmallow = "^3.15.0"
flasgger = "^0.9.7b2"
apispec-webframeworks = "^1.0.0"
PyJWT = "^2.3.0"
apispec = "^6.0.0"
psycopg2-binary = "^2.9.3"
Flask-Limiter = "^3.0.0"
APScheduler = "^3.10.0"

[tool.poetry.dev-dependencies]
black = "^24.0.0"
mypy = "^1.0"
isort = "^5.10.1"
pydocstyle = "^6.1.1"
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
toml = "^0.10.2"
pylint = "^2.13.9"
openapi-spec-validator = "^0.6.0"

[tool.pydocstyle]
match-dir = "^(?!alembic).*"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.isort]
profile = "black"

[tool.mypy]
exclude = ["^alembic"]

[[tool.mypy.overrides]]
module = ["apispec_webframeworks.flask", "flasgger.*", "openapi_spec_validator", "apscheduler.*",]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.pylint.MASTER]
ignore-patterns = ["tests", "alembic"]

[tool.pylint.'MESSAGES CONTROL']
disable = ["R0903", "R0801", "W1203"]
max-line-length = 88
good-names = ["id"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
